name: OLAMA Stage 2 IR Hardening
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden service worker caching, uploads, and WordPress sessions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            umask 077
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            OUT="${BACKUP}/hardening"
            NGINX_CONF="/etc/nginx/sites-enabled/olama.online.conf"
            mkdir -p "${OUT}"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)
            cp -a "${NGINX_CONF}" "${OUT}/olama.online.conf.before"
            cp -a "${DOCROOT}/wp-config.php" "${OUT}/wp-config.php.before"
            sha256sum "${NGINX_CONF}" "${DOCROOT}/wp-config.php" > "${OUT}/before-sha256.txt"
            python3 - <<'PY'
            from pathlib import Path
            path = Path('/etc/nginx/sites-enabled/olama.online.conf')
            text = path.read_text()
            marker = '# OLAMA Stage 2 incident-response hardening'
            if marker not in text:
                needle = '  server_name olama.online www1.olama.online;\n  root /home/olama/htdocs/olama.online;\n'
                if text.count(needle) < 2:
                    raise SystemExit('Expected OLAMA public and upstream server blocks were not found')
                block = '''  server_name olama.online www1.olama.online;
  root /home/olama/htdocs/olama.online;

  # OLAMA Stage 2 incident-response hardening
  location = /nochain-sw.js {
    pagespeed off;
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /nochain-sw.js =404;
  }

  location ~* ^/wp-content/uploads/.*\\.(?:php[0-9]?|phtml|phar)$ {
    deny all;
    return 404;
  }
'''
                text = text.replace(needle, block, 1)
                path.write_text(text)
            PY
            if ! nginx -t; then
              cp -a "${OUT}/olama.online.conf.before" "${NGINX_CONF}"
              nginx -t
              exit 71
            fi
            wp --allow-root --path="${DOCROOT}" config set DISALLOW_FILE_EDIT true --raw
            wp --allow-root --path="${DOCROOT}" config set FORCE_SSL_ADMIN true --raw
            wp --allow-root --path="${DOCROOT}" config shuffle-salts
            chown olama:olama "${DOCROOT}/wp-config.php"
            chmod 0660 "${DOCROOT}/wp-config.php"
            systemctl reload nginx
            sleep 2
            curl -ksSI --resolve olama.online:443:127.0.0.1 'https://olama.online/nochain-sw.js?verify=20260829' > "${OUT}/cleanup-sw-origin-headers-after.txt"
            grep -Eqi '^cache-control:.*no-store' "${OUT}/cleanup-sw-origin-headers-after.txt"
            grep -Eqi '^service-worker-allowed:[[:space:]]*/' "${OUT}/cleanup-sw-origin-headers-after.txt"
            CODE="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve olama.online:443:127.0.0.1 'https://olama.online/wp-content/uploads/olama-logs/index.php')"
            [ "${CODE}" = "404" ]
            wp --allow-root --path="${DOCROOT}" config get DISALLOW_FILE_EDIT | grep -qx true
            wp --allow-root --path="${DOCROOT}" config get FORCE_SSL_ADMIN | grep -qx true
            sha256sum "${NGINX_CONF}" "${DOCROOT}/wp-config.php" > "${OUT}/after-sha256.txt"
            cp -a "${NGINX_CONF}" "${OUT}/olama.online.conf.after"
            cp -a "${DOCROOT}/wp-config.php" "${OUT}/wp-config.php.after"
            chmod -R go-rwx "${OUT}"
            echo '=== HARDENING HASHES ==='
            cat "${OUT}/before-sha256.txt" "${OUT}/after-sha256.txt"
            echo '=== SERVICE WORKER ORIGIN HEADERS ==='
            cat "${OUT}/cleanup-sw-origin-headers-after.txt"
            echo "UPLOADS_PHP_HTTP=${CODE}"
            echo 'HARDENING_OK'

