name: OLAMA Stage 2 IR Targeted Evidence

on:
  push:
    branches:
      - codex/olama-stage2-ir

permissions:
  contents: read

jobs:
  targeted-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture loader, database, account, and access-log evidence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            umask 077
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            OUT="${BACKUP}/targeted-evidence"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            mkdir -p "${OUT}"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)

            echo "=== LOADER HASHES ==="
            sha256sum               "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php"               "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/site-helper-1317e86c55e6.php"               "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/.state.json"               "${DOCROOT}/nochain-sw.js"

            cp --parents -a               "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php"               "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/site-helper-1317e86c55e6.php"               "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/.state.json"               "${DOCROOT}/nochain-sw.js"               "${OUT}"

            echo "=== NC-DROPIN SOURCE ==="
            sed -n '1,260p' "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php"

            echo "=== SITE-HELPER SOURCE ==="
            sed -n '1,260p' "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/site-helper-1317e86c55e6.php"

            echo "=== STATE JSON ==="
            cat "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/.state.json"

            echo "=== RESTORE ZIP CONTENTS ==="
            unzip -l "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6/backup/restore.zip" || true

            echo "=== ACTIVE PLUGIN OPTION ==="
            wp --allow-root --path="${DOCROOT}" option get active_plugins --format=json

            echo "=== DATABASE IOC OPTIONS USING LIKE ==="
            wp --allow-root --path="${DOCROOT}" db query "SELECT option_id, option_name, autoload, LENGTH(option_value) AS value_length FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' ORDER BY option_id" --table || true

            echo "=== DATABASE IOC CONTENT COUNTS ==="
            wp --allow-root --path="${DOCROOT}" db query "SELECT 'posts' AS source, COUNT(*) AS matches FROM ${PREFIX}posts WHERE post_content LIKE '%site-helper-1317e86c55e6%' OR post_content LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR post_content LIKE '%nochain-sw.js%' UNION ALL SELECT 'postmeta', COUNT(*) FROM ${PREFIX}postmeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'usermeta', COUNT(*) FROM ${PREFIX}usermeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%'" --table || true

            echo "=== USER REGISTRATION TIMELINE ==="
            wp --allow-root --path="${DOCROOT}" db query "SELECT DATE(user_registered) AS registered_date, COUNT(*) AS users FROM ${PREFIX}users WHERE user_registered >= '2026-07-01' GROUP BY DATE(user_registered) ORDER BY registered_date" --table

            echo "=== ADMINISTRATOR ACCOUNT DETAILS ==="
            wp --allow-root --path="${DOCROOT}" user list --role=administrator --fields=ID,user_login,user_registered,roles --format=table

            echo "=== SIMPLE HISTORY TABLES AND SCHEMA ==="
            wp --allow-root --path="${DOCROOT}" db tables | grep -E 'simple|history' || true
            for t in $(wp --allow-root --path="${DOCROOT}" db tables | grep -E 'simple|history' || true); do
              echo "--- ${t} ---"
              wp --allow-root --path="${DOCROOT}" db query "SHOW COLUMNS FROM ${t}" --table || true
            done

            echo "=== REDACTED ACCESS LOG IOC EVENTS ==="
            find /var/log /home/olama -type f \( -name '*.log' -o -name '*.log.*' -o -name '*.gz' \) -newermt '2026-07-07 00:00:00 UTC' -print0 2>/dev/null > "${OUT}/candidate-logs.list0" || true
            : > "${OUT}/ioc-access-events-redacted.txt"
            while IFS= read -r -d '' lf; do
              zgrep -hEi 'site-helper-1317e86c55e6|nochain-sw|runtime-sample|vendor\.min|plugin-install\.php|update\.php.action.upload-plugin|plugins\.php.*action=activate' "${lf}" 2>/dev/null || true
            done < "${OUT}/candidate-logs.list0" | sed -E 's/^([^ ]+)/[redacted-ip]/' | head -400 | tee "${OUT}/ioc-access-events-redacted.txt" || true

            (
              cd "${OUT}"
              find . -type f -print0 | sort -z | xargs -0 sha256sum > TARGETED-EVIDENCE-SHA256SUMS
            )
            chmod -R go-rwx "${OUT}"
            echo "TARGETED_EVIDENCE_OK path=${OUT}"
