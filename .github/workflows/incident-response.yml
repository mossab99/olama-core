name: OLAMA Stage 2 IR Database Cleanup
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Remove exact residual malware references and revoke admin sessions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            umask 077
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            OUT="${BACKUP}/database-cleanup"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            mkdir -p "${OUT}"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)
            wp --allow-root --path="${DOCROOT}" db query "SELECT * FROM ${PREFIX}options WHERE option_name IN ('recently_activated','SimplePluginLogger_plugin_info_before_update','wpvivid_task_list')" --batch --raw > "${OUT}/affected-options-before.tsv"
            sha256sum "${OUT}/affected-options-before.tsv" > "${OUT}/affected-options-before-sha256.txt"
            cat > "${OUT}/serialized-cleanup.php" <<'PHP'
            <?php
            $ioc = 'site-helper-1317e86c55e6';
            $path = 'site-helper-1317e86c55e6/site-helper-1317e86c55e6.php';
            $recent = get_option('recently_activated', array());
            if (is_array($recent) && array_key_exists($path, $recent)) {
                unset($recent[$path]);
                update_option('recently_activated', $recent, false);
            }
            $history = get_option('SimplePluginLogger_plugin_info_before_update', array());
            if (is_array($history) && array_key_exists($path, $history)) {
                unset($history[$path]);
                update_option('SimplePluginLogger_plugin_info_before_update', $history, false);
            } elseif (is_string($history)) {
                $decoded = json_decode($history, true);
                if (is_array($decoded) && array_key_exists($path, $decoded)) {
                    unset($decoded[$path]);
                    update_option(
                        'SimplePluginLogger_plugin_info_before_update',
                        wp_json_encode($decoded, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE),
                        false
                    );
                }
            }
            $scrub = static function ($value) use (&$scrub, $ioc) {
                if (is_array($value)) {
                    $clean = array();
                    foreach ($value as $key => $child) {
                        if (is_string($key) && strpos($key, $ioc) !== false) {
                            continue;
                        }
                        $clean[$key] = $scrub($child);
                    }
                    return $clean;
                }
                if (is_string($value) && strpos($value, $ioc) !== false) {
                    return str_replace($ioc, 'quarantined-malware-reference-removed', $value);
                }
                return $value;
            };
            $tasks = get_option('wpvivid_task_list', null);
            if ($tasks !== null) {
                update_option('wpvivid_task_list', $scrub($tasks), false);
            }
            PHP
            wp --allow-root --path="${DOCROOT}" eval-file "${OUT}/serialized-cleanup.php"
            for id in 1 4 10850 10857 10986; do
              wp --allow-root --path="${DOCROOT}" user session destroy "${id}" --all || true
            done
            wp --allow-root --path="${DOCROOT}" cache flush || true
            wp --allow-root --path="${DOCROOT}" db query "SELECT * FROM ${PREFIX}options WHERE option_name IN ('recently_activated','SimplePluginLogger_plugin_info_before_update','wpvivid_task_list')" --batch --raw > "${OUT}/affected-options-after.tsv"
            sha256sum "${OUT}/affected-options-after.tsv" > "${OUT}/affected-options-after-sha256.txt"
            echo '=== DATABASE IOC COUNTS AFTER SERIALIZED CLEANUP ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT 'options' source,COUNT(*) matches FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'posts',COUNT(*) FROM ${PREFIX}posts WHERE post_content LIKE '%site-helper-1317e86c55e6%' OR post_content LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR post_content LIKE '%nochain-sw.js%' UNION ALL SELECT 'postmeta',COUNT(*) FROM ${PREFIX}postmeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'usermeta',COUNT(*) FROM ${PREFIX}usermeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%'" --table | tee "${OUT}/database-ioc-counts-after.txt"
            TOTAL="$(wp --allow-root --path="${DOCROOT}" db query "SELECT (SELECT COUNT(*) FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%')+(SELECT COUNT(*) FROM ${PREFIX}posts WHERE post_content LIKE '%site-helper-1317e86c55e6%' OR post_content LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR post_content LIKE '%nochain-sw.js%')+(SELECT COUNT(*) FROM ${PREFIX}postmeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%')+(SELECT COUNT(*) FROM ${PREFIX}usermeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%')" --skip-column-names)"
            [ "${TOTAL}" = "0" ]
            echo '=== DATABASE CHANGE HASHES ==='
            cat "${OUT}/affected-options-before-sha256.txt" "${OUT}/affected-options-after-sha256.txt"
            (cd "${OUT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum > DATABASE-CLEANUP-SHA256SUMS)
            chmod -R go-rwx "${OUT}"
            echo 'DATABASE_CLEANUP_OK'

