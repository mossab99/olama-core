name: OLAMA Stage 2 IR Nginx Audit
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect service worker routing and concise remediation state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            echo '=== NGINX SERVER FILES ==='
            grep -RIlE 'server_name[[:space:]].*olama\.online' /etc/nginx 2>/dev/null || true
            echo '=== NGINX OLAMA SERVER CONTEXT ==='
            nginx -T 2>/dev/null | grep -nE -B8 -A35 'server_name[[:space:]].*olama\.online' | head -240
            echo '=== NGINX CACHE AND PAGESPEED DIRECTIVES ==='
            nginx -T 2>/dev/null | grep -nEi -B3 -A5 'pagespeed|expires|Cache-Control|location .*\.(js|css)' | head -260
            echo '=== CONCISE IOC COUNTS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT 'options' source,COUNT(*) matches FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'posts',COUNT(*) FROM ${PREFIX}posts WHERE post_content LIKE '%site-helper-1317e86c55e6%' OR post_content LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR post_content LIKE '%nochain-sw.js%' UNION ALL SELECT 'postmeta',COUNT(*) FROM ${PREFIX}postmeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'usermeta',COUNT(*) FROM ${PREFIX}usermeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%'" --table
            echo '=== UPLOAD EXECUTABLES ==='
            find "${DOCROOT}/wp-content/uploads" -xdev -type f \( -iname '*.php' -o -iname '*.phtml' -o -iname '*.phar' -o -iname '*.php.*' -o -perm /111 \) -printf '%m %u:%g %s %p\n' | sort
            echo '=== UPDATE SUMMARY ==='
            wp --allow-root --path="${DOCROOT}" plugin list --update=available --fields=name,status,version,update_version --format=table 2>/dev/null || true
            wp --allow-root --path="${DOCROOT}" theme list --update=available --fields=name,status,version,update_version --format=table 2>/dev/null || true
            echo '=== ADMIN DETAILS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT u.ID,u.user_login,u.user_registered,IF(LOCATE('@',u.user_email)>0,SUBSTRING(u.user_email,LOCATE('@',u.user_email)+1),'') email_domain,MAX(CASE WHEN m.meta_key='wp_capabilities' THEN m.meta_value END) capabilities FROM ${PREFIX}users u JOIN ${PREFIX}usermeta m ON m.user_id=u.ID WHERE u.ID IN (1,4,10850,10857,10986) GROUP BY u.ID,u.user_login,u.user_registered,u.user_email ORDER BY u.ID" --table
            echo '=== PUBLIC DEBUG FILES ==='
            find "${DOCROOT}" -xdev -type f \( -name 'fix_target_type_column.php' -o -name 'scratch.php' -o -name 'tmp_test_insert.php' -o -name 'tmp_test_loop.php' -o -name 'create_prepared_campaign.php' -o -name 'debug-settings.php' -o -name 'test_opts2.php' -o -name 'local-xdebuginfo.php' \) -printf '%m %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TSZ %p\n'
            echo 'NGINX_AUDIT_OK'

