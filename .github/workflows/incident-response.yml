name: OLAMA Stage 2 IR Database and Account Audit
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Inspect residual database IOCs and privileged access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            umask 077
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            OUT="${BACKUP}/database-account-audit"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            mkdir -p "${OUT}"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)
            echo '=== RESIDUAL OPTION IOC CONTEXT ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT option_id,option_name,autoload,LENGTH(option_value) value_length,CASE WHEN LOCATE('site-helper-1317e86c55e6',option_value)>0 THEN SUBSTRING(option_value,GREATEST(1,LOCATE('site-helper-1317e86c55e6',option_value)-120),360) WHEN LOCATE('0x58460d0b3d4d6b03761c89120393c0c676676496',option_value)>0 THEN SUBSTRING(option_value,GREATEST(1,LOCATE('0x58460d0b3d4d6b03761c89120393c0c676676496',option_value)-120),360) WHEN LOCATE('nochain-sw.js',option_value)>0 THEN SUBSTRING(option_value,GREATEST(1,LOCATE('nochain-sw.js',option_value)-120),360) ELSE '' END context FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' ORDER BY option_id" --table | tee "${OUT}/residual-option-ioc-context.txt"
            wp --allow-root --path="${DOCROOT}" db query "SELECT * FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' ORDER BY option_id" --batch --raw > "${OUT}/residual-option-rows-full.tsv"
            echo '=== ADMIN SESSION COUNTS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT u.ID,u.user_login,u.user_registered,IF(LOCATE('@',u.user_email)>0,SUBSTRING(u.user_email,LOCATE('@',u.user_email)+1),'') email_domain,LENGTH(COALESCE(s.meta_value,'')) session_value_length,CASE WHEN s.meta_value IS NULL THEN 0 ELSE (LENGTH(s.meta_value)-LENGTH(REPLACE(s.meta_value,'login','')))/5 END approximate_sessions FROM ${PREFIX}users u LEFT JOIN ${PREFIX}usermeta s ON s.user_id=u.ID AND s.meta_key='session_tokens' WHERE u.ID IN (1,4,10850,10857,10986) ORDER BY u.ID" --table | tee "${OUT}/admin-session-counts.txt"
            echo '=== PRIVILEGED USER META KEYS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT u.ID,u.user_login,m.meta_key,LENGTH(m.meta_value) value_length FROM ${PREFIX}users u JOIN ${PREFIX}usermeta m ON m.user_id=u.ID WHERE u.ID IN (1,4,10850,10857,10986) AND (m.meta_key LIKE '%two%factor%' OR m.meta_key LIKE '%wordfence%' OR m.meta_key LIKE '%login%' OR m.meta_key='session_tokens') ORDER BY u.ID,m.meta_key" --table | tee "${OUT}/privileged-security-meta.txt"
            echo '=== SSH AUTHORIZED KEY FINGERPRINTS ==='
            : > "${OUT}/ssh-key-fingerprints.txt"
            find /root /home -maxdepth 3 -type f -path '*/.ssh/authorized_keys' -print0 2>/dev/null | while IFS= read -r -d '' f; do
              echo "FILE ${f} owner=$(stat -c '%U:%G' "${f}") mode=$(stat -c '%a' "${f}")" | tee -a "${OUT}/ssh-key-fingerprints.txt"
              ssh-keygen -lf "${f}" 2>/dev/null | tee -a "${OUT}/ssh-key-fingerprints.txt" || true
            done
            cat "${OUT}/ssh-key-fingerprints.txt"
            echo '=== LOGIN-CAPABLE SYSTEM USERS ==='
            getent passwd | awk -F: '$7 !~ /(nologin|false)$/ {print $1 ":" $3 ":" $6 ":" $7}' | tee "${OUT}/login-capable-users.txt"
            echo '=== DATABASE ACCOUNTS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT User,Host,plugin,account_locked,password_expired FROM mysql.user ORDER BY User,Host" --table 2>&1 | tee "${OUT}/database-accounts.txt" || true
            echo '=== AUTH LOG WINDOW AROUND MALWARE MTIME ==='
            zgrep -hE 'Aug[[:space:]]+([[:space:]]*6|[[:space:]]*7|[[:space:]]*8)|2026-08-0[678]' /var/log/auth.log* 2>/dev/null | sed -E 's/(from )[0-9a-fA-F:.]+/\1[redacted-ip]/g; s/(rhost=)[0-9a-fA-F:.]+/\1[redacted-ip]/g' | grep -Ei 'Accepted|Failed|session opened|sudo|useradd|usermod' | head -300 | tee "${OUT}/auth-window-redacted.txt" || true
            echo '=== ORIGINAL AND CURRENT CONFIG HASHES ==='
            sha256sum "${BACKUP}/config/wp-config.php" "${DOCROOT}/wp-config.php" | tee "${OUT}/wp-config-original-current-sha256.txt"
            tar -tzf "${BACKUP}/server-configs.tar.gz" | grep -E 'etc/nginx/sites-(enabled|available)/olama\.online\.conf$' | tee "${OUT}/nginx-config-archive-paths.txt"
            while IFS= read -r p; do tar -xOzf "${BACKUP}/server-configs.tar.gz" "${p}" | sha256sum | sed "s#  -#  archive:${p}#"; done < "${OUT}/nginx-config-archive-paths.txt" | tee "${OUT}/nginx-config-original-sha256.txt"
            sha256sum /etc/nginx/sites-enabled/olama.online.conf | tee "${OUT}/nginx-config-current-sha256.txt"
            (cd "${OUT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum > DATABASE-ACCOUNT-AUDIT-SHA256SUMS)
            chmod -R go-rwx "${OUT}"
            echo 'DATABASE_ACCOUNT_AUDIT_OK'

