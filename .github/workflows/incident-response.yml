name: OLAMA Stage 2 IR Post-Containment Audit
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run integrity, persistence, account, and configuration checks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -Eeuo pipefail
            umask 077
            export WP_CLI_PHP_ARGS='-d error_reporting=24575 -d display_errors=0'
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            OUT="${BACKUP}/post-containment-audit"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            mkdir -p "${OUT}"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)
            echo '=== CORE CHECKSUMS ==='
            wp --allow-root --path="${DOCROOT}" core verify-checksums 2>&1 | tee "${OUT}/core-checksums.txt" || true
            echo '=== PLUGIN CHECKSUMS ==='
            wp --allow-root --path="${DOCROOT}" plugin verify-checksums --all --strict 2>&1 | tee "${OUT}/plugin-checksums.txt" || true
            echo '=== PLUGIN INVENTORY ==='
            wp --allow-root --path="${DOCROOT}" plugin list --fields=name,status,version,update,update_version --format=table 2>&1 | tee "${OUT}/plugins.txt"
            echo '=== THEME INVENTORY ==='
            wp --allow-root --path="${DOCROOT}" theme list --fields=name,status,version,update,update_version --format=table 2>&1 | tee "${OUT}/themes.txt"
            echo '=== IOC FILESYSTEM SEARCH ==='
            grep -RIlE 'site-helper-1317e86c55e6|0x58460d0b3d4d6b03761c89120393c0c676676496|nochain_bootstrap|runtime-sample\.js|nochain_plant|nochain_admin_ips' "${DOCROOT}" --exclude='nochain-sw.js' --exclude='olama-security-cleanup.php' 2>/dev/null | tee "${OUT}/ioc-files.txt" || true
            echo '=== RECENT PHP FILES SINCE INCIDENT WINDOW ==='
            find "${DOCROOT}" -xdev -type f -name '*.php' -newermt '2026-07-07 00:00:00 UTC' -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %u:%g %m %p\n' | sort | tee "${OUT}/recent-php.txt"
            echo '=== EXECUTABLE OR PHP-LIKE FILES IN UPLOADS ==='
            find "${DOCROOT}/wp-content/uploads" -xdev -type f \( -iname '*.php' -o -iname '*.phtml' -o -iname '*.phar' -o -iname '*.php.*' -o -perm /111 \) -printf '%m %u:%g %s %p\n' | sort | tee "${OUT}/uploads-executable.txt"
            echo '=== MUST-USE PLUGINS ==='
            wp --allow-root --path="${DOCROOT}" plugin list --status=must-use --fields=name,status,version --format=table 2>&1 | tee "${OUT}/mu-plugins.txt"
            echo '=== WP CRON ==='
            wp --allow-root --path="${DOCROOT}" cron event list --fields=hook,next_run_gmt,recurrence --format=table 2>&1 | tee "${OUT}/wp-cron.txt"
            echo '=== SYSTEM CRON AND TIMERS ==='
            crontab -l 2>&1 | tee "${OUT}/root-crontab.txt" || true
            find /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.weekly /var/spool/cron -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %m %u:%g %p\n' 2>/dev/null | sort | tee "${OUT}/system-cron-files.txt"
            systemctl list-timers --all --no-pager | tee "${OUT}/system-timers.txt"
            echo '=== DATABASE IOC COUNTS ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT 'options' source,COUNT(*) matches FROM ${PREFIX}options WHERE option_name LIKE '%nochain%' OR option_name LIKE '%site-helper%' OR option_value LIKE '%site-helper-1317e86c55e6%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR option_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'posts',COUNT(*) FROM ${PREFIX}posts WHERE post_content LIKE '%site-helper-1317e86c55e6%' OR post_content LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR post_content LIKE '%nochain-sw.js%' UNION ALL SELECT 'postmeta',COUNT(*) FROM ${PREFIX}postmeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%' UNION ALL SELECT 'usermeta',COUNT(*) FROM ${PREFIX}usermeta WHERE meta_value LIKE '%site-helper-1317e86c55e6%' OR meta_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%' OR meta_value LIKE '%nochain-sw.js%'" --table | tee "${OUT}/database-ioc-counts.txt"
            echo '=== ADMINISTRATORS ==='
            wp --allow-root --path="${DOCROOT}" user list --role=administrator --fields=ID,user_login,user_registered,roles --format=table 2>&1 | tee "${OUT}/administrators.txt"
            echo '=== SUSPICIOUS ADMIN METADATA ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT u.ID,u.user_login,u.user_registered,LEFT(u.user_email,LOCATE('@',u.user_email)-1) email_local,IF(LOCATE('@',u.user_email)>0,SUBSTRING(u.user_email,LOCATE('@',u.user_email)+1),'') email_domain,m.meta_key,LEFT(m.meta_value,300) meta_value FROM ${PREFIX}users u LEFT JOIN ${PREFIX}usermeta m ON m.user_id=u.ID WHERE u.ID IN (10850,10857,10986) AND m.meta_key IN ('wp_capabilities','wp_user_level','first_name','last_name','nickname','description') ORDER BY u.ID,m.meta_key" --table | tee "${OUT}/suspicious-admin-metadata.txt"
            echo '=== USERS CREATED IN MASS-REGISTRATION WINDOW ==='
            wp --allow-root --path="${DOCROOT}" db query "SELECT ID,user_login,user_registered FROM ${PREFIX}users WHERE user_registered BETWEEN '2026-07-20 00:00:00' AND '2026-07-23 23:59:59' ORDER BY user_registered,ID" --table | tee "${OUT}/mass-registration-users.txt"
            echo '=== SERVER HARDENING STATE ==='
            stat -c '%a %U:%G %n' "${DOCROOT}/wp-config.php" "${DOCROOT}/.htaccess" 2>/dev/null | tee "${OUT}/sensitive-file-permissions.txt" || true
            wp --allow-root --path="${DOCROOT}" config get DISALLOW_FILE_EDIT 2>&1 | tee "${OUT}/disallow-file-edit.txt" || true
            wp --allow-root --path="${DOCROOT}" config get FORCE_SSL_ADMIN 2>&1 | tee "${OUT}/force-ssl-admin.txt" || true
            ufw status verbose | tee "${OUT}/ufw-status.txt" || true
            fail2ban-client status 2>&1 | tee "${OUT}/fail2ban-status.txt" || true
            echo '=== ORIGIN IOC RESPONSE CHECK ==='
            for ua in 'Mozilla/5.0' 'Googlebot' 'facebookexternalhit/1.1' 'curl/8.0'; do
              slug="$(printf '%s' "${ua}" | tr -cs 'A-Za-z0-9' '_')"
              curl -ksS --resolve olama.online:443:127.0.0.1 -A "${ua}" https://olama.online/ -o "${OUT}/origin-${slug}.html"
              if grep -Eqi 'site-helper-1317e86c55e6|0x58460d0b3d4d6b03761c89120393c0c676676496|nochain_bootstrap|runtime-sample\.js|vendor\.min\.js' "${OUT}/origin-${slug}.html"; then echo "IOC_FOUND ua=${ua}"; exit 61; else echo "CLEAN ua=${ua}"; fi
            done
            (cd "${OUT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum > POST-CONTAINMENT-AUDIT-SHA256SUMS)
            chmod -R go-rwx "${OUT}"
            echo "POST_CONTAINMENT_AUDIT_OK path=${OUT}"

name: OLAMA Stage 2 IR Containment
on:
  push:
    branches:
      - codex/olama-stage2-ir
permissions:
  contents: read
jobs:
  contain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Quarantine confirmed malware and deploy cleanup worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            umask 077
            DOCROOT="/home/olama/htdocs/olama.online"
            BACKUP="/root/olama-stage2-backup-20260828T204123Z"
            Q="${BACKUP}/quarantine"
            PREFIX="$(wp --allow-root --path="${DOCROOT}" config get table_prefix)"
            mkdir -p "${Q}/live" "${Q}/pre-containment"
            (cd "${BACKUP}" && sha256sum -c SHA256SUMS)
            date -u +%FT%TZ > "${Q}/containment-started-utc.txt"
            wp --allow-root --path="${DOCROOT}" plugin list --format=json > "${Q}/pre-containment/plugin-list.json"
            wp --allow-root --path="${DOCROOT}" option get active_plugins --format=json > "${Q}/pre-containment/active-plugins.json"
            wp --allow-root --path="${DOCROOT}" db query "SELECT option_id,option_name,autoload,LENGTH(option_value) value_length FROM ${PREFIX}options WHERE option_name IN ('nochain_admin_ips','nochain_plant','nochain_installer_slug')" --table > "${Q}/pre-containment/malware-options.txt"
            for f in "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php" "${DOCROOT}/nochain-sw.js"; do
              [ ! -e "${f}" ] || cp --parents -a "${f}" "${Q}/pre-containment"
            done
            [ ! -d "${DOCROOT}/wp-content/nochain" ] || cp --parents -a "${DOCROOT}/wp-content/nochain" "${Q}/pre-containment"
            [ ! -d "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6" ] || cp --parents -a "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6" "${Q}/pre-containment"
            find "${DOCROOT}/wp-content/uploads" -type f -name 'cache-fe46eab4.jpg' -print0 | while IFS= read -r -d '' f; do cp --parents -a "${f}" "${Q}/pre-containment"; done
            (cd "${Q}/pre-containment" && find . -type f -print0 | sort -z | xargs -0 sha256sum > PRE-CONTAINMENT-SHA256SUMS)
            wp --allow-root --path="${DOCROOT}" plugin deactivate site-helper-1317e86c55e6
            qmove() {
              src="$1"
              [ ! -e "${src}" ] && return 0
              dst="${Q}/live${src}"
              mkdir -p "$(dirname "${dst}")"
              mv "${src}" "${dst}"
            }
            find "${DOCROOT}/wp-content/uploads" -type f -name 'cache-fe46eab4.jpg' -print0 | while IFS= read -r -d '' f; do qmove "${f}"; done
            qmove "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6"
            qmove "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php"
            qmove "${DOCROOT}/wp-content/nochain"
            wp --allow-root --path="${DOCROOT}" option delete nochain_admin_ips || true
            wp --allow-root --path="${DOCROOT}" option delete nochain_plant || true
            wp --allow-root --path="${DOCROOT}" option delete nochain_installer_slug || true
            WIDGET_MATCHES="$(wp --allow-root --path="${DOCROOT}" db query "SELECT COUNT(*) FROM ${PREFIX}options WHERE option_name IN ('widget_custom_html','sidebars_widgets') AND (option_value LIKE '%nochain-sw%' OR option_value LIKE '%nochain_sw%' OR option_value LIKE '%0x58460d0b3d4d6b03761c89120393c0c676676496%')" --skip-column-names)"
            [ "${WIDGET_MATCHES}" = "0" ] || { echo "Unexpected planted widget detected; stopping before broad serialized-data edit"; exit 41; }
            cat > "${DOCROOT}/nochain-sw.js" <<'CLEANUP_SW'
            'use strict';
            self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', event => event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.clients.claim();
              const windows = await self.clients.matchAll({type: 'window', includeUncontrolled: true});
              await self.registration.unregister();
              for (const client of windows) {
                try { await client.navigate(client.url); } catch (error) {}
              }
            })()));
            self.addEventListener('fetch', () => {});
            CLEANUP_SW
            chown olama:olama "${DOCROOT}/nochain-sw.js"
            chmod 0644 "${DOCROOT}/nochain-sw.js"
            cat > "${DOCROOT}/wp-content/mu-plugins/olama-security-cleanup.php" <<'CLEANUP_PHP'
            <?php
            /**
             * Temporary incident-response helper.
             * Forces the replacement cleanup service worker and removes NoChain browser storage.
             * Remove after 2026-09-30 once remediation monitoring is complete.
             */
            defined('ABSPATH') || exit;
            add_action('wp_head', static function () {
                if (is_admin()) {
                    return;
                }
                ?>
                <script id="olama-security-cleanup">
                (async()=>{try{
                  if('caches' in window){for(const key of await caches.keys()){await caches.delete(key);}}
                  for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(key&&key.indexOf('nc:')===0){localStorage.removeItem(key);}}
                  document.cookie='nc_skip=; Max-Age=0; path=/; SameSite=Lax';
                  if('serviceWorker' in navigator){
                    const reg=await navigator.serviceWorker.register('/nochain-sw.js?cleanup=20260829',{scope:'/',updateViaCache:'none'});
                    await reg.update();
                  }
                }catch(error){}})();
                </script>
                <?php
            }, 0);
            CLEANUP_PHP
            chown olama:olama "${DOCROOT}/wp-content/mu-plugins/olama-security-cleanup.php"
            chmod 0644 "${DOCROOT}/wp-content/mu-plugins/olama-security-cleanup.php"
            CACHE="/home/olama/tmp/pagespeed_cache/v3/olama.online"
            if [ -d "${CACHE}" ]; then
              CACHE_UID="$(stat -c %u "${CACHE}")"
              CACHE_GID="$(stat -c %g "${CACHE}")"
              CACHE_MODE="$(stat -c %a "${CACHE}")"
              mv "${CACHE}" "${Q}/pagespeed-cache-pre-containment"
              mkdir -p "${CACHE}"
              chown "${CACHE_UID}:${CACHE_GID}" "${CACHE}"
              chmod "${CACHE_MODE}" "${CACHE}"
            fi
            wp --allow-root --path="${DOCROOT}" cache flush || true
            wp --allow-root --path="${DOCROOT}" transient delete --all || true
            nginx -t
            systemctl reload nginx
            sleep 2
            wp --allow-root --path="${DOCROOT}" plugin is-active site-helper-1317e86c55e6 && exit 51 || true
            [ ! -e "${DOCROOT}/wp-content/mu-plugins/nc-dropin.php" ]
            [ ! -d "${DOCROOT}/wp-content/plugins/site-helper-1317e86c55e6" ]
            [ ! -d "${DOCROOT}/wp-content/nochain" ]
            test "$(wp --allow-root --path="${DOCROOT}" option get nochain_admin_ips 2>/dev/null || true)" = ""
            curl -ksS --resolve olama.online:443:127.0.0.1 -A 'Mozilla/5.0' https://olama.online/ -o "${Q}/origin-after-containment-browser.html"
            curl -ksS --resolve olama.online:443:127.0.0.1 -A 'Googlebot' https://olama.online/ -o "${Q}/origin-after-containment-googlebot.html"
            ! grep -Eqi 'site-helper-1317e86c55e6|0x58460d0b3d4d6b03761c89120393c0c676676496|nochain_bootstrap|runtime-sample\.js|vendor\.min\.js' "${Q}/origin-after-containment-browser.html"
            ! grep -Eqi 'site-helper-1317e86c55e6|0x58460d0b3d4d6b03761c89120393c0c676676496|nochain_bootstrap|runtime-sample\.js|vendor\.min\.js' "${Q}/origin-after-containment-googlebot.html"
            curl -ksSI --resolve olama.online:443:127.0.0.1 'https://olama.online/nochain-sw.js?cleanup=20260829' > "${Q}/cleanup-sw-origin-headers.txt"
            sha256sum "${DOCROOT}/nochain-sw.js" "${DOCROOT}/wp-content/mu-plugins/olama-security-cleanup.php" > "${Q}/cleanup-files-sha256.txt"
            date -u +%FT%TZ > "${Q}/containment-completed-utc.txt"
            chmod -R go-rwx "${Q}"
            echo "CONTAINMENT_OK"

